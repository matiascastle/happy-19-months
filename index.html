<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070b09">
<style>img{max-width:100%}</style>
</head>
<body>
<title>Museo de Aya</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap">
<style>
  :root{
    --bronce:#c2a15c; --bronce-claro:#efd9a6; --luz:#f8eccd;
    --marfil:#f1e8d5; --marfil-sombra:#ddd1b6;
    --tinta:#2b2721; --tinta-suave:#6c6353;
    --noche:#070b09; --texto:#e9e1cd; --texto-suave:#a89e84;
    --serif:"EB Garamond",Georgia,"Times New Roman",serif;
    --display:"Bodoni Moda","EB Garamond",Georgia,serif;
    --signage:"Jost","Futura",Avenir,"Helvetica Neue",sans-serif;
  }
  html,body{height:100%}
  [hidden]{display:none!important}
  body{
    margin:0; overflow:hidden; background:var(--noche); color:var(--texto);
    font-family:var(--serif); font-size:16px;
    -webkit-user-select:none; user-select:none; touch-action:none;
  }
  canvas{display:block}
  #escena{position:fixed; inset:0; z-index:0}
  #telon{position:fixed; inset:0; z-index:45; background:#040705; pointer-events:none; opacity:0; transition:opacity 1600ms ease}

  /* ---------- vestíbulo ---------- */
  #vestibulo{
    position:fixed; inset:0; z-index:46;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:24px; text-align:center;
    padding:calc(26px + env(safe-area-inset-top,0px)) 22px calc(26px + env(safe-area-inset-bottom,0px));
    background:
      radial-gradient(125% 78% at 50% 2%, rgba(248,236,205,.14), transparent 58%),
      linear-gradient(180deg,#17241d,#070d0a);
    transition:opacity 1000ms ease;
  }
  #vestibulo.saliendo{opacity:0; pointer-events:none}
  #vestibulo > *{position:relative; z-index:1}
  #vestibulo .corazon{
    position:absolute; z-index:0; bottom:-60px; font-size:22px; color:rgba(240,130,165,.55);
    animation:subir linear infinite; text-shadow:0 0 18px rgba(255,150,190,.6); pointer-events:none;
  }
  #vestibulo .corazon.oro{color:rgba(239,217,166,.5)}
  @keyframes subir{ 0%{transform:translateY(0) scale(.8); opacity:0} 12%{opacity:1} 100%{transform:translateY(-110vh) scale(1.25) rotate(18deg); opacity:0} }
  #vestibulo .ocasion{
    font-family:var(--signage); font-size:11px; letter-spacing:.38em;
    text-transform:uppercase; color:var(--bronce); margin:0;
  }
  #vestibulo h1{
    font-family:var(--display); font-weight:400; font-size:clamp(44px,10.5vw,92px);
    line-height:1; margin:0; color:var(--luz); text-wrap:balance;
    text-shadow:0 0 52px rgba(248,236,205,.3);
  }
  #vestibulo .dedicatoria{max-width:44ch; margin:0; font-size:18px; color:var(--texto)}
  #vestibulo .filete{width:130px; height:1px; background:linear-gradient(90deg,transparent,var(--bronce),transparent)}
  #puerta{display:flex; flex-direction:column; align-items:center; gap:10px}
  #puerta label{font-family:var(--signage); font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--texto-suave)}
  #clave{
    width:min(78vw,320px); text-align:center; padding:12px 16px; background:rgba(7,12,9,.55);
    border:1px solid rgba(194,161,92,.45); color:var(--luz); font-family:var(--serif); font-size:20px; letter-spacing:.04em; outline:none;
  }
  #clave:focus{border-color:var(--bronce-claro); box-shadow:0 0 0 3px rgba(239,217,166,.15)}
  #clave.mal{animation:sacudir 420ms ease; border-color:#c0506a}
  @keyframes sacudir{0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)}}
  #pista{font-family:var(--signage); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#d98aa0; min-height:14px; margin:0}
  #entrar{
    font-family:var(--signage); font-size:12px; letter-spacing:.3em; text-transform:uppercase;
    color:#1d1508; cursor:pointer; border:0; padding:16px 38px;
    background:linear-gradient(160deg,#e7cf98,#a3823f 48%,#7d6330);
    box-shadow:0 16px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.45);
    transition:filter 220ms ease, transform 220ms ease;
  }
  #entrar:hover{filter:brightness(1.1); transform:translateY(-2px)}
  #entrar[disabled]{opacity:.45; cursor:progress; transform:none}
  #vestibulo .instrucciones{
    font-family:var(--signage); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--texto-suave); margin:0; line-height:2;
  }
  #vestibulo .ticket{
    background:var(--marfil); color:var(--tinta); padding:15px 22px; transform:rotate(-1.4deg);
    font-family:var(--signage); box-shadow:0 20px 38px rgba(0,0,0,.5); text-align:left;
  }
  #vestibulo .ticket b{display:block; font-family:var(--serif); font-size:22px; letter-spacing:0}
  #vestibulo .ticket span{font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--tinta-suave)}

  /* ---------- HUD ---------- */
  #hud{position:fixed; inset:0; z-index:20; pointer-events:none}
  #sala-actual{
    position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); left:18px;
    font-family:var(--signage); font-size:10px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--texto-suave); text-shadow:0 2px 10px rgba(0,0,0,.95);
    transition:opacity 500ms ease;
  }
  #sala-actual b{
    display:block; font-family:var(--display); font-size:18px; letter-spacing:.03em;
    color:var(--luz); text-transform:none; margin-top:5px;
  }
  #mira{
    position:absolute; top:50%; left:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
    border:1px solid rgba(248,236,205,.45); border-radius:50%;
    transition:background 260ms ease, transform 260ms ease, border-color 260ms ease;
  }
  #mira.activa{background:var(--bronce-claro); border-color:var(--bronce-claro); transform:scale(1.8)}
  #mira.oculta{opacity:0}
  #aviso{
    position:absolute; left:50%; top:calc(50% + 28px); transform:translateX(-50%);
    font-family:var(--signage); font-size:10px; letter-spacing:.26em; text-transform:uppercase;
    color:var(--luz); text-shadow:0 2px 12px rgba(0,0,0,.95); white-space:nowrap;
    opacity:0; transition:opacity 260ms ease;
  }
  #aviso.visible{opacity:1}
  #ayuda{
    position:absolute; bottom:calc(16px + env(safe-area-inset-bottom,0px)); left:18px; right:18px;
    font-family:var(--signage); font-size:10px; letter-spacing:.2em; text-transform:uppercase;
    color:rgba(168,158,132,.72); text-shadow:0 2px 8px rgba(0,0,0,.9);
    transition:opacity 900ms ease;
  }
  #botones{
    position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); right:16px;
    display:flex; gap:8px; pointer-events:auto;
  }
  #botones button{
    background:rgba(7,12,9,.55); border:1px solid rgba(194,161,92,.4); color:var(--bronce-claro);
    padding:8px 13px; cursor:pointer; backdrop-filter:blur(6px);
    font-family:var(--signage); font-size:10px; letter-spacing:.22em; text-transform:uppercase;
    transition:background 220ms ease, border-color 220ms ease;
  }
  #botones button:hover{background:rgba(194,161,92,.16); border-color:var(--bronce-claro)}
  #botones button.activo{background:rgba(194,161,92,.24); border-color:var(--bronce-claro); color:#fff6e2}
  #joystick{
    position:absolute; left:calc(22px + env(safe-area-inset-left,0px));
    bottom:calc(44px + env(safe-area-inset-bottom,0px));
    width:118px; height:118px; border-radius:50%; pointer-events:auto;
    border:1px solid rgba(194,161,92,.3); background:rgba(7,12,9,.3);
  }
  #joystick .punto{
    position:absolute; top:50%; left:50%; width:46px; height:46px; margin:-23px 0 0 -23px;
    border-radius:50%; background:rgba(239,217,166,.5); box-shadow:0 0 18px rgba(239,217,166,.3);
  }

  /* ---------- photo viewer ---------- */
  #ficha{
    position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));
    background:rgba(4,8,6,.95); backdrop-filter:blur(8px);
    animation:aparecer 420ms ease both;
  }
  @keyframes aparecer{from{opacity:0} to{opacity:1}}
  #ficha img{
    max-width:min(94vw,1200px); max-height:calc(100vh - 90px); display:block;
    box-shadow:0 40px 80px rgba(0,0,0,.7); border:12px solid #a3823f;
    outline:1px solid rgba(255,240,205,.35); outline-offset:-7px;
  }
  #cerrar-ficha{
    position:absolute; top:calc(18px + env(safe-area-inset-top,0px)); right:18px;
    background:rgba(7,12,9,.6); border:1px solid rgba(194,161,92,.5); color:var(--bronce-claro);
    padding:9px 15px; cursor:pointer;
    font-family:var(--signage); font-size:10px; letter-spacing:.24em; text-transform:uppercase;
  }
  #cerrar-ficha:hover{background:rgba(194,161,92,.14)}

  :focus-visible{outline:2px solid var(--bronce-claro); outline-offset:3px}

  @media (max-width:760px){ #ayuda{display:none} }
  @media (prefers-reduced-motion:reduce){ #ficha{animation:none} }
</style>

<div id="escena"></div>
<div id="telon"></div>

<div id="hud" hidden>
  <div id="sala-actual">You are in<b>the entrance hall</b></div>
  <div id="mira"></div>
  <div id="aviso"></div>
  <div id="ayuda">W A S D or arrows to walk · shift to hurry · drag to look around · click a photo to see it up close</div>
  <div id="botones">
    <button id="tour" type="button">Guided tour</button>
    <button id="salir" type="button">Exit</button>
  </div>
  <div id="joystick" hidden><div class="punto"></div></div>
</div>

<div id="vestibulo">
  <p class="ocasion" id="v-ocasion">Free admission</p>
  <h1 id="v-titulo">Happy 19 Months</h1>
  <div class="filete"></div>
  <p class="dedicatoria" id="v-dedicatoria"></p>
  <div class="ticket"><span>Free admission · Visitor</span><b id="v-visitante">—</b></div>
  <div id="puerta">
    <label for="clave">Whisper the secret word</label>
    <input id="clave" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Secret word">
    <p id="pista"></p>
  </div>
  <button id="entrar" type="button" disabled>Turning the lights on…</button>
  <p class="instrucciones" id="v-instrucciones"></p>
</div>

<div id="ficha" hidden>
  <button id="cerrar-ficha" type="button">Close</button>
  <img id="ficha-img" alt="">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="obras.js"></script>
<script>
(function(){
  var M = window.MUSEO || {titulo:"Happy 19 Months", fotos:[], viajes:[], nombres:{}};
  var FOTOS = M.fotos || [];
  var NOMBRES = M.nombres || {};
  var TITULO = M.titulo || "Happy 19 Months";
  var VIAJES = (M.viajes || []).join("  ·  ");
  var vestibulo = document.getElementById("vestibulo");
  var btnEntrar = document.getElementById("entrar");
  var esTactil = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  var suave = !matchMedia("(prefers-reduced-motion: reduce)").matches;

  document.getElementById("v-titulo").textContent = TITULO;
  document.getElementById("v-ocasion").textContent = "Free admission · For " + (M.visitante || "you");
  document.getElementById("v-dedicatoria").textContent = VIAJES;
  document.getElementById("v-visitante").textContent = M.visitante || "—";
  document.getElementById("v-instrucciones").innerHTML = esTactil
    ? "Joystick to walk · drag to look around<br>Tap a photo to see it up close<br>or let the guided tour take you"
    : "W A S D or arrows to walk · mouse to look around<br>Click a photo to see it up close<br>or let the guided tour take you";

  for(var ci=0; ci<16; ci++){
    var cz = document.createElement("span"); cz.className = "corazon" + (ci % 3 === 0 ? " oro" : ""); cz.textContent = "♥";
    cz.style.left = (3 + Math.random()*94) + "%"; cz.style.animationDuration = (9 + Math.random()*9) + "s";
    cz.style.animationDelay = (-Math.random()*16) + "s"; cz.style.fontSize = (14 + Math.random()*22) + "px";
    vestibulo.appendChild(cz);
  }
  if(typeof THREE === "undefined"){
    btnEntrar.textContent = "The museum could not open";
    document.getElementById("v-instrucciones").textContent = "This browser could not load the 3D viewer. Try an up-to-date Chrome or Safari.";
    return;
  }

function construirTodo(){

  /* ================= layout ================= */
  var HALF = 5, ALTO = 4.8, OJO = 1.62, ARCO_A = 1.55, ARCO_Y = 2.25, R_ABSIDE = HALF;
  var Z_HALL = 12, PASO = 3.3, MARGEN = 4.6;
  var porSala = Math.max(2, M.porSala || 9);

  // rooms: chunks of photos, each room as long as it needs
  var salas = [];
  var zCursor = 0;
  for(var s0 = 0; s0 < FOTOS.length; s0 += porSala){
    var grupo = FOTOS.slice(s0, s0 + porSala);
    var porPared = Math.ceil(grupo.length / 2);
    var largo = Math.max(14, porPared * PASO + MARGEN);
    salas.push({fotos:grupo, zIni:zCursor, zFin:zCursor - largo, largo:largo, porPared:porPared});
    zCursor -= largo;
  }
  if(!salas.length){ salas.push({fotos:[], zIni:0, zFin:-14, largo:14, porPared:0}); zCursor = -14; }
  var Z_FIN = zCursor;
  var largoTotal = Z_HALL - Z_FIN, zCentro = (Z_HALL + Z_FIN)/2;
  var ROMANOS = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];

  var escena = new THREE.Scene();
  escena.background = new THREE.Color(0x070b09);
  escena.fog = new THREE.Fog(0x080f0c, 9, 60);

  var camara = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.08, 260);
  camara.rotation.order = "YXZ";
  camara.position.set(0, OJO, Z_HALL - 2.6);

  var render = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
  render.setPixelRatio(Math.min(devicePixelRatio, esTactil ? 1.6 : 2));
  render.setSize(innerWidth, innerHeight);
  if(THREE.sRGBEncoding) render.outputEncoding = THREE.sRGBEncoding;
  if(THREE.ACESFilmicToneMapping){ render.toneMapping = THREE.ACESFilmicToneMapping; render.toneMappingExposure = 0.05; }
  render.shadowMap.enabled = true;
  render.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById("escena").appendChild(render.domElement);

  /* ================= textures ================= */
  function lienzo(w, h, pintar){
    var c = document.createElement("canvas"); c.width = w; c.height = h;
    pintar(c.getContext("2d"), w, h);
    var t = new THREE.CanvasTexture(c);
    if(THREE.sRGBEncoding) t.encoding = THREE.sRGBEncoding;
    t.anisotropy = render.capabilities.getMaxAnisotropy();
    return t;
  }
  var texPiso = lienzo(1024, 1024, function(ctx,w,h){
    ctx.fillStyle = "#1d150e"; ctx.fillRect(0,0,w,h);
    for(var f=0; f<16; f++) for(var x=-((f%2)*96); x<w; x+=192){
      var t = 0.62 + Math.random()*0.42;
      ctx.fillStyle = "rgb(" + Math.round(70*t) + "," + Math.round(47*t) + "," + Math.round(30*t) + ")";
      ctx.fillRect(x+2, f*64+2, 188, 60);
      ctx.globalAlpha = .12;
      for(var v=0; v<14; v++){
        ctx.strokeStyle = Math.random() > .5 ? "#2a1c10" : "#8a6034"; ctx.lineWidth = Math.random()*1.6;
        var yy = f*64 + 6 + Math.random()*52;
        ctx.beginPath(); ctx.moveTo(x+4, yy);
        ctx.bezierCurveTo(x+60, yy+(Math.random()-.5)*8, x+130, yy+(Math.random()-.5)*8, x+188, yy); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.lineWidth = 2.5;
    for(var i=0;i<17;i++){ ctx.beginPath(); ctx.moveTo(0,i*64); ctx.lineTo(w,i*64); ctx.stroke(); }
  });
  texPiso.wrapS = texPiso.wrapT = THREE.RepeatWrapping; texPiso.repeat.set(3, largoTotal/8);

  var texPared = lienzo(512, 512, function(ctx,w,h){
    var g = ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,"#25382c"); g.addColorStop(1,"#172620");
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    ctx.globalAlpha = .06;
    for(var y=0; y<h; y+=3){ ctx.fillStyle = (y % 6) ? "#dfeadf" : "#0c1510"; ctx.fillRect(0, y, w, 1); }
    ctx.globalAlpha = 1;
    for(var i=0;i<14000;i++){ ctx.fillStyle = "rgba(255,255,255," + (Math.random()*0.025) + ")"; ctx.fillRect(Math.random()*w, Math.random()*h, 1.6, 1.6); }
  });
  texPared.wrapS = texPared.wrapT = THREE.RepeatWrapping; texPared.repeat.set(6, 2.4);

  var texAlfombra = lienzo(512, 512, function(ctx,w,h){
    ctx.fillStyle = "#4b1421"; ctx.fillRect(0,0,w,h);
    for(var i=0;i<9000;i++){ ctx.fillStyle = "rgba(255,190,190," + (Math.random()*0.05) + ")"; ctx.fillRect(Math.random()*w, Math.random()*h, 2.2, 2.2); }
    ctx.strokeStyle = "rgba(194,161,92,.6)"; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(34,0); ctx.lineTo(34,h); ctx.moveTo(w-34,0); ctx.lineTo(w-34,h); ctx.stroke();
    ctx.strokeStyle = "rgba(194,161,92,.28)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(52,0); ctx.lineTo(52,h); ctx.moveTo(w-52,0); ctx.lineTo(w-52,h); ctx.stroke();
  });
  texAlfombra.wrapS = texAlfombra.wrapT = THREE.RepeatWrapping; texAlfombra.repeat.set(1, largoTotal/9);

  function gradienteVertical(paradas){
    return lienzo(64, 256, function(ctx,w,h){
      var g = ctx.createLinearGradient(0,0,0,h);
      paradas.forEach(function(p){ g.addColorStop(p[0], p[1]); });
      ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    });
  }
  var texHaz = gradienteVertical([[0,"rgba(255,238,202,.9)"],[.4,"rgba(255,232,190,.26)"],[1,"rgba(255,228,185,0)"]]);
  var texResplandor = gradienteVertical([[0,"rgba(248,236,205,.6)"],[.45,"rgba(248,236,205,.16)"],[1,"rgba(248,236,205,0)"]]);
  var texMota = lienzo(64, 64, function(ctx,w,h){
    var g = ctx.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,"rgba(255,242,214,1)"); g.addColorStop(.35,"rgba(255,226,170,.5)"); g.addColorStop(1,"rgba(255,220,160,0)");
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  });
  var texHalo = lienzo(128, 128, function(ctx,w,h){
    var g = ctx.createRadialGradient(64,64,0,64,64,64);
    g.addColorStop(0,"rgba(255,246,225,.7)"); g.addColorStop(.5,"rgba(255,236,200,.18)"); g.addColorStop(1,"rgba(255,236,200,0)");
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  });

  try {
    var equi = lienzo(1024, 512, function(ctx,w,h){
      var g = ctx.createLinearGradient(0,0,0,h);
      g.addColorStop(0,"#2b3b32"); g.addColorStop(.32,"#f0dcb4"); g.addColorStop(.5,"#243229"); g.addColorStop(1,"#0d1410");
      ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
      for(var i=0;i<9;i++){
        var gx = ctx.createRadialGradient(80+i*115, 150, 0, 80+i*115, 150, 70);
        gx.addColorStop(0,"rgba(255,236,196,.85)"); gx.addColorStop(1,"rgba(255,236,196,0)");
        ctx.fillStyle = gx; ctx.fillRect(10+i*115, 80, 140, 140);
      }
    });
    equi.mapping = THREE.EquirectangularReflectionMapping;
    var pmrem = new THREE.PMREMGenerator(render); pmrem.compileEquirectangularShader();
    escena.environment = pmrem.fromEquirectangular(equi).texture; pmrem.dispose();
  } catch(err){}

  /* ================= materials ================= */
  function std(o){ return new THREE.MeshStandardMaterial(o); }
  var matPared = std({map:texPared, roughness:0.93, metalness:0.02, envMapIntensity:0.35});
  var matPiso  = std({map:texPiso, roughness:0.26, metalness:0.12, envMapIntensity:0.85, transparent:true, opacity:0.86});
  var matTecho = std({color:0x0e1913, roughness:0.96});
  var matBronce = std({color:0xc8a45f, roughness:0.24, metalness:0.96, envMapIntensity:1.35});
  var matMadera = std({color:0x3b2a1b, roughness:0.52, metalness:0.06, envMapIntensity:0.5});
  var matTerciopelo = std({color:0x5c1827, roughness:0.98});
  var matAlfombra = std({map:texAlfombra, roughness:0.99});
  var matPasse = std({color:0xf1e8d5, roughness:0.92});
  var matNieve = std({color:0xf7f7f4, roughness:0.85});
  var matPiedra = std({color:0xe4e1d8, roughness:0.8, metalness:0.02});
  var matNegro = std({color:0x141210, roughness:0.6});
  var matVerdeSS = std({color:0x4d7a3a, roughness:0.7});
  var matBlanco = std({color:0xf4f1ea, roughness:0.75});

  function caja(w,h,d,mat,x,y,z,opts){

    var dt = Math.min(reloj.getDelta(), 0.05); tiempo += dt; cuadroN++;

    for(var i=0;i<apliques.length;i++){
      var f = 0.7 + Math.sin(tiempo*6.6 + i*2.1)*0.14 + Math.sin(tiempo*16 + i)*0.08;
      apliques[i].llama.material.opacity = f; apliques[i].halo.material.opacity = 0.2 + f*0.12;
    }
    luzEntrada.intensity = 0.68 + Math.sin(tiempo*5.7)*0.08;
    for(var h=0; h<haces.length; h++) haces[h].material.opacity = (h === haces.length-1 ? 0.2 : 0.14) + Math.sin(tiempo*0.6 + h)*0.03;
    var pm = motas.geometry.attributes.position;
    for(var p=0; p<totalMotas; p++){
      pm.array[p*3+1] += velMotas[p] * dt; pm.array[p*3] += Math.sin(tiempo*0.35 + p) * dt * 0.05;
      if(pm.array[p*3+1] > ALTO - 0.25) pm.array[p*3+1] = 0.12;
    }
    pm.needsUpdate = true;
    if(fantasma){
      fantasma.grupo.position.y = fantasma.base + Math.sin(tiempo*1.3)*0.14;
      fantasma.grupo.rotation.y = Math.sin(tiempo*0.5)*0.35;
      fantasma.halo.material.opacity = 0.45 + Math.sin(tiempo*1.3)*0.12;
      fantasma.halo.lookAt(camara.position);
    }
    if(fantasma){ fantasma.orbita.rotation.y = tiempo*0.6; fantasma.corazon.scale.setScalar(1 + Math.sin(tiempo*2.6)*0.06); }
    if(jardin){
      jardin.grande.rotation.y = tiempo*0.7; jardin.grande.position.y = Math.sin(tiempo*1.1)*0.12;
      jardin.grande.scale.setScalar(1 + Math.sin(tiempo*2.2)*0.05);
      jardin.orbita.rotation.y = -tiempo*0.45; jardin.orbita.position.y = Math.sin(tiempo*0.8)*0.1;
      jardin.halo.lookAt(camara.position); jardin.halo.material.opacity = 0.42 + Math.sin(tiempo*2.2)*0.1;
      jardin.luz.intensity = 1.3 + Math.sin(tiempo*2.2)*0.3;
    }
    var pc = corazones.geometry.attributes.position;
    for(var hc2=0; hc2<nCorazones; hc2++){
      pc.array[hc2*3+1] += velCor[hc2] * dt;
      pc.array[hc2*3] += Math.sin(tiempo*0.8 + faseCor[hc2]) * dt * 0.12;
      if(pc.array[hc2*3+1] > ALTO - 0.3) pc.array[hc2*3+1] = 0.3;
    }
    pc.needsUpdate = true;
    if(cuadroN % 2 === 1){
      var ch = hadas.geometry.attributes.color;
      for(var fh2=0; fh2<nHadas; fh2++){
        var b2 = 0.55 + 0.45 * Math.max(0, Math.sin(tiempo*2.1 + faseHadas[fh2]) * Math.sin(tiempo*0.37 + faseHadas[fh2]*1.7) + 0.35);
        ch.array[fh2*3] = b2; ch.array[fh2*3+1] = b2*0.9; ch.array[fh2*3+2] = b2*0.7;
      }
      ch.needsUpdate = true;
    }

    if(cuadroN % 2 === 0 && cuadros.length){
      var orden = cuadros.map(function(c, idx){ return {i:idx, d:c.pos.distanceTo(camara.position)}; }).sort(function(a,b){ return a.d - b.d; });
      for(var lf2=0; lf2<focos.length; lf2++){
        var luz = focos[lf2], sel = orden[lf2];
        if(!sel || sel.d > 15){ luz.intensity = 0; continue; }
        var c = cuadros[sel.i];
        luz.position.set(c.pos.x + c.normal.x * 1.2, c.cy + c.ah/2 + 0.72, c.pos.z + c.normal.z * 1.2);
        luz.target.position.set(c.pos.x, c.cy - 0.1, c.pos.z); luz.target.updateMatrixWorld();
        luz.intensity = 3.4 * Math.max(0, Math.min(1, (15 - sel.d) / 5));
      }
      var mejorDeco = null, mejorDist = 1e9;
      for(var dp=0; dp<decoPuntos.length; dp++){ var dd2 = decoPuntos[dp].distanceTo(camara.position); if(dd2 < mejorDist){ mejorDist = dd2; mejorDeco = decoPuntos[dp]; } }
      if(mejorDeco && mejorDist < 18){
        focoDeco.position.set(mejorDeco.x + 0.6, ALTO - 0.4, mejorDeco.z + 1.4);
        focoDeco.target.position.set(mejorDeco.x, 0.6, mejorDeco.z); focoDeco.target.updateMatrixWorld();
        focoDeco.intensity = 2.6 * Math.max(0, Math.min(1, (18 - mejorDist) / 6));
      } else focoDeco.intensity = 0;
    }

    if(intro < DURA_INTRO){
      intro = Math.min(intro + dt, DURA_INTRO);
      var fi = intro / DURA_INTRO, ei = 1 - Math.pow(1 - fi, 3);
      yaw = yawObj = Math.PI * (1 - ei);
      camara.position.z = (Z_HALL - 2.6) - ei * 2.4;
      render.toneMappingExposure = 0.05 + (expObj - 0.05) * Math.min(1, fi * 1.35);
    } else if(!pausa){
      render.toneMappingExposure = expObj;
      if(tour.activo){
        var par = paradas[tour.i];
        if(tour.fase === "yendo"){
          tour.t += dt;
          var ft = Math.min(1, tour.t / tour.dur), et = ft < 0.5 ? 4*ft*ft*ft : 1 - Math.pow(-2*ft + 2, 3)/2;
          camara.position.lerpVectors(tour.desde, par.pos, et);
          var dy = ((par.yaw - tour.yawDesde + Math.PI*3) % (Math.PI*2)) - Math.PI;
          yaw = yawObj = tour.yawDesde + dy * et; pitch = pitchObj = 0;
          if(ft >= 1){ tour.fase = "mirando"; tour.t = 0; }
        } else {
          tour.t += dt;
          if(tour.t > 4.2){ if(tour.i + 1 < paradas.length) arrancarTour(tour.i + 1); else cortarTour(); }
        }
      } else {
        var adelante = (teclas.KeyW || teclas.ArrowUp ? 1 : 0) - (teclas.KeyS || teclas.ArrowDown ? 1 : 0) - joy.y;
        var lateral  = (teclas.KeyD || teclas.ArrowRight ? 1 : 0) - (teclas.KeyA || teclas.ArrowLeft ? 1 : 0) + joy.x;
        adelante = Math.max(-1, Math.min(1, adelante)); lateral = Math.max(-1, Math.min(1, lateral));
        var corriendo = teclas.ShiftLeft || teclas.ShiftRight;
        deseada.set(lateral, 0, -adelante); if(deseada.lengthSq() > 1) deseada.normalize();
        deseada.multiplyScalar(corriendo ? 4.2 : 2.5); deseada.applyAxisAngle(ejeY, yaw);
        var k = 1 - Math.exp(-7 * dt);
        velActual.x += (deseada.x - velActual.x) * k; velActual.z += (deseada.z - velActual.z) * k;
        var ox = camara.position.x, oz = camara.position.z;
        var np = limitar(ox + velActual.x * dt, oz + velActual.z * dt, ox, oz);
        camara.position.x = np[0]; camara.position.z = np[1];
        var rapidez = Math.hypot(velActual.x, velActual.z);
        if(suave && rapidez > 0.2){
          pasos += dt * (5.2 + rapidez * 1.4);
          camara.position.y = OJO + Math.sin(pasos) * 0.02 * Math.min(rapidez/2.5, 1.4);
          roll += (Math.sin(pasos/2) * 0.0055 * Math.min(rapidez/2.5, 1) - roll) * 0.1;
        } else { camara.position.y += (OJO - camara.position.y) * 0.12; roll += (0 - roll) * 0.1; }
        fovObj = corriendo && rapidez > 1 ? 64 : 60;
        if((cuadroN % 3) === 0){
          var obj = objetivo();
          if(obj !== apuntada){
            apuntada = obj; mira.classList.toggle("activa", !!obj);
            aviso.textContent = obj ? (esTactil ? "Tap to see it up close" : "Click to see it up close") : "";
            aviso.classList.toggle("visible", !!obj);
          }
        }
      }
      var sala = nombreSala(camara.position.z), clave = sala.t + sala.n;
      if(clave !== salaVisible){
        salaVisible = clave; salaHud.style.opacity = "0";
        setTimeout(function(s){ return function(){ salaHud.innerHTML = s.t + "<b>" + s.n + "</b>"; salaHud.style.opacity = "1"; }; }(sala), 260);
      }
    }

    var sm = 1 - Math.exp(-16 * dt);
    yaw += (yawObj - yaw) * sm; pitch += (pitchObj - pitch) * sm;
    camara.rotation.set(pitch, yaw, roll);
    if(Math.abs(camara.fov - fovObj) > 0.05){ camara.fov += (fovObj - camara.fov) * 0.08; camara.updateProjectionMatrix(); }
    farol.position.copy(camara.position);
    render.render(escena, camara);
  }

  addEventListener("resize", function(){ camara.aspect = innerWidth / innerHeight; camara.updateProjectionMatrix(); render.setSize(innerWidth, innerHeight); });

  btnEntrar.disabled = false;
  btnEntrar.textContent = "Enter the museum";
  animar();

} /* end construirTodo */

  if(document.fonts && document.fonts.ready){
    var listo = false, arrancar = function(){ if(!listo){ listo = true; construirTodo(); } };
    document.fonts.ready.then(arrancar); setTimeout(arrancar, 2500);
  } else construirTodo();
})();
</script>
